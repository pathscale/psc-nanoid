name: CI

on:
  push:
    branches: [master]
    tags: ['**']
  pull_request:
    branches: [master]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubicloud-standard-2
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-unknown-none
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
      - run: cargo hack check --feature-powerset --no-dev-deps
      - name: Check no_std library and downstream macro
        run: |
          cargo check --lib --no-default-features --features packed,rkyv,serde,zeroize --target aarch64-unknown-none
          cargo check --manifest-path tests/no-std/Cargo.toml --target aarch64-unknown-none
      - run: cargo doc --all-features --no-deps
      - run: cargo publish --dry-run

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [check]
    runs-on: ubicloud-standard-2
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
