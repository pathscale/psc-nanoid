[package]
name = "psc-nanoid"
version = "3.1.2"
edition = "2021"
description = "Fork of nid crate"
repository = "https://github.com/pathscale/psc-nanoid"
license = "MIT OR Apache-2.0"
keywords = ["nanoid", "unique", "nano", "id", "uuid"]
categories = ["data-structures", "parser-implementations"]
exclude = ["/.github", "/.gitignore", "/tests/no-std"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "doc_auto_cfg"]

[dependencies]
thiserror = { version = "^2", default-features = false }
serde = { version = "^1", optional = true, default-features = false, features = ["alloc"] }
rand = { version = "^0.8", default-features = false }
zeroize = { version = "1.7", features = ["zeroize_derive"], optional = true }
rkyv = { version = "^0.8", optional = true, default-features = false, features = ["alloc", "bytecheck"] }

[dev-dependencies]
serde_json = "1.0"
pretty_assertions = "1.4"

[features]
default = ["std"]
std = ["rand/std", "rand/std_rng", "serde?/std", "rkyv?/std", "thiserror/std"]
packed = []
rkyv = ["dep:rkyv"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(doc_auto_cfg)'] }
